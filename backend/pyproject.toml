[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphich-backend"
version = "0.1.0"
description = "Company data preparation for Alphich news analytics"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
alphich-data = "alphich.data:main"

[tool.setuptools.packages.find]
where = ["src"]
