name: Deploy Cloud.ru (manual or after CI)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to publish the current, CI-passed main commit'
        required: true
        type: string
  workflow_run:
    workflows: ['CI — offline integration']
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudru-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm == 'deploy') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Confirm current main commit and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit SHA' >&2; exit 1; }
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$TARGET_SHA" != "$current_main" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
              echo "SKIP_STALE_CI: main moved from $TARGET_SHA to $current_main"
              echo 'DEPLOY_CURRENT=false' >> "$GITHUB_ENV"
              exit 0
            fi
            echo 'Manual deployment targeted an outdated main commit; start a new run.' >&2
            exit 1
          fi
          successes="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&per_page=30" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")] | length')"
          if [[ "$successes" -lt 1 ]]; then
            echo 'Current main SHA has no successful push CI; deployment blocked.' >&2
            exit 1
          fi
          echo "CI_OK: $TARGET_SHA"
      - name: Deploy current commit over restricted SSH
        if: env.DEPLOY_CURRENT != 'false'
        env:
          DEPLOY_KEY: ${{ secrets.CLOUDRU_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.CLOUDRU_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo 'Missing CLOUDRU_DEPLOY_KEY or CLOUDRU_KNOWN_HOSTS secret.' >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/cloudru_deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cloudru_deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/cloudru_deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            alphich@89.232.176.172 "deploy ${TARGET_SHA}"
