x-rss-environment: &rss-environment
  RSS_ENABLED: ${RSS_ENABLED:-1}
  RSS_POLL_MINUTES: ${RSS_POLL_MINUTES:-5}
  RSS_COLLECTOR_WORKERS: ${RSS_COLLECTOR_WORKERS:-3}
  RSS_CONFIG: ${RSS_CONFIG:-/srv/app/rss_sources.json}

x-llm-environment: &llm-environment
  <<: *rss-environment
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-}
  LLM_ANALYSIS_MODEL: ${LLM_ANALYSIS_MODEL:-}
  LLM_MODEL_CATALOG_JSON: ${LLM_MODEL_CATALOG_JSON:-[]}
  LLM_PRICES_CONFIRMED: ${LLM_PRICES_CONFIRMED:-0}
  LLM_BUDGET_MODE: ${LLM_BUDGET_MODE:-token_prices}
  LLM_RECEIPT_RUB_PER_UNIT: ${LLM_RECEIPT_RUB_PER_UNIT:-}
  LLM_DAILY_LIMIT_RUB: ${LLM_DAILY_LIMIT_RUB:-500}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
  LLM_MAX_CALLS: ${LLM_MAX_CALLS:-8}
  LLM_MAX_TOOLS: ${LLM_MAX_TOOLS:-8}
  BANK_INDEX_DIR: /data/processed/bank-index-v1
  E5_MODEL_DIR: /data/models/e5-base
  E5_MODEL_MANIFEST: /srv/knowledge/embedding-model.json
  BANK_ALLOWED_DOCUMENT_IDS: ${BANK_ALLOWED_DOCUMENT_IDS-*}
  COMPANY_CONTEXT_DIR: ${COMPANY_CONTEXT_DIR:-}
  NEWS_FEED_MAX_EVENTS: ${NEWS_FEED_MAX_EVENTS:-2000}
  AI_AUTOMATION_ENABLED: ${AI_AUTOMATION_ENABLED:-0}
  AI_AUTOMATION_COMPANY_IDS: ${AI_AUTOMATION_COMPANY_IDS:-}
  AI_AUTOMATION_ROLES: ${AI_AUTOMATION_ROLES:-cfo}
  AI_AUTOMATION_MAX_EXTRACTIONS: ${AI_AUTOMATION_MAX_EXTRACTIONS:-20}
  AI_AUTOMATION_MAX_CARDS: ${AI_AUTOMATION_MAX_CARDS:-10}
  AI_AUTOMATION_SCAN_LIMIT: ${AI_AUTOMATION_SCAN_LIMIT:-1000}

services:
  postgres:
    image: postgres:16.8
    restart: unless-stopped
    environment:
      POSTGRES_DB: alphich
      POSTGRES_USER: alphich
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphich -d alphich"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *llm-environment
      DATABASE_URL: postgresql+psycopg://alphich:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/alphich
      DEMO_COMPANY_IDS: ${DEMO_COMPANY_IDS:-U_9250,U_99802,U_44792}
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/processed:/data/processed:ro
      - ./data/models:/data/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker", "--poll-interval", "1"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      <<: *rss-environment
      DATABASE_URL: postgresql+psycopg://alphich:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/alphich
      DEMO_COMPANY_IDS: ${DEMO_COMPANY_IDS:-U_9250,U_99802,U_44792}
  analysis-worker:
    stop_grace_period: 20m
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.intelligence.worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      <<: *llm-environment
      DATABASE_URL: postgresql+psycopg://alphich:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/alphich
      DEMO_COMPANY_IDS: ${DEMO_COMPANY_IDS:-U_9250,U_99802,U_44792}
    volumes:
      - ./data/processed:/data/processed:ro
      - ./data/models:/data/models:ro
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
  rss-collector:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.rss"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      <<: *rss-environment
      DATABASE_URL: postgresql+psycopg://alphich:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/alphich
      DEMO_COMPANY_IDS: ${DEMO_COMPANY_IDS:-U_9250,U_99802,U_44792}
      RSS_COMPANY_IDS: ${RSS_COMPANY_IDS:-}
volumes:
  pgdata:
