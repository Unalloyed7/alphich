[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphich-knowledge"
version = "0.1.0"
description = "Offline preparation of attributed bank evidence for Alphich"
requires-python = ">=3.12"
dependencies = ["tokenizers==0.21.4"]

[project.optional-dependencies]
retrieval = ["numpy==2.2.6", "onnxruntime==1.23.2"]

[project.scripts]
alphich-kb = "alphich_kb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
